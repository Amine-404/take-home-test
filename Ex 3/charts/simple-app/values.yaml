replicaCount: 1

image:
  repository: "hello-world-rest"
  tag: ""
  pullPolicy: "IfNotPresent"

service:
  type: "ClusterIP"
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 100m
    memory: 648Mi
  requests:
    cpu: 20m
    memory: 32Mi


probes:
  livenessProbe:
    path: /hello-world
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    path: /hello-world
    initialDelaySeconds: 5
    periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL